{% extends "base.html" %}

{% block title %}Admin Login - ZANDO Cambodia{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-10">
  <div class="bg-white rounded-3xl border border-slate-200/80 shadow-xl p-8 sm:p-10 space-y-6">
    
    <div class="text-center space-y-2">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-slate-950 text-white flex items-center justify-center font-display font-black text-2xl shadow-md">
        Z
      </div>
      <h1 class="text-2xl font-display font-black text-slate-950 tracking-tight">ZANDO Admin Portal</h1>
      <p class="text-xs text-slate-500">Manage products, inventory drops, and KHQR orders</p>
    </div>

    <!-- Login Form (Pure HTML POST) -->
    <form action="{{ url_for('admin.login', next=request.args.get('next')) }}" method="POST" class="space-y-4">
      
      <div>
        <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
          Admin Username
        </label>
        <input
          type="text"
          id="username"
          name="username"
          required
          autofocus
          placeholder="admin"
          class="w-full border border-slate-300 rounded-2xl px-4 py-3 text-sm focus:border-rose-500 focus:outline-none transition shadow-inner bg-slate-50/50 focus:bg-white"
        >
      </div>

      <div>
        <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
          Password
        </label>
        <input
          type="password"
          id="password"
          name="password"
          required
          placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
          class="w-full border border-slate-300 rounded-2xl px-4 py-3 text-sm focus:border-rose-500 focus:outline-none transition shadow-inner bg-slate-50/50 focus:bg-white"
        >
      </div>

      <div class="pt-2">
        <button
          type="submit"
          class="w-full bg-slate-950 hover:bg-rose-600 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg hover:shadow-xl transition text-sm transform active:scale-95"
        >
          Sign In to Dashboard
        </button>
      </div>

    </form>

    <div class="text-center pt-3 border-t border-slate-100">
      <p class="text-[11px] text-slate-400">
        Default Seed Credentials: <span class="font-mono text-slate-700 font-bold">admin</span> / <span class="font-mono text-slate-700 font-bold">admin123</span>
      </p>
    </div>

  </div>
</div>
{% endblock %}
